[project]
name = "client-agent"
version = "1.0.0"
description = "SLMS Windows Client Agent"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "keyring>=25.7.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "websocket-client>=1.8.0",
    "pywin32>=310; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
build = [
    "pyinstaller>=6.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring multiple components or live server",
    "windows_only: Tests requiring Windows operating system and/or specific Windows privileges",
    "load: Performance and concurrency load tests",
]
