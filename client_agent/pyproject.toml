[project]
name = "client-agent"
version = "1.0.0"
description = "SLMS Windows Client Agent"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "keyring>=25.7.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "websocket-client>=1.8.0",
    "pywin32>=310",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
