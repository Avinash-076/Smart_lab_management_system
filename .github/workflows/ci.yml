name: CI Quality Gate

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    name: Lint & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dev dependencies
        run: |
          uv pip install --system ruff

      - name: Run Ruff Syntax & Critical Bug Checks
        run: |
          ruff check --select E9,F63,F7,F82 client_agent backend

      - name: Check compilation
        run: |
          python -m compileall -q client_agent backend/app

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv sync

      - name: Run Backend Tests with Coverage
        working-directory: backend
        run: |
          uv run pytest tests -q --cov=app --cov-report=term --cov-fail-under=55

  client-unit-tests:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install client dependencies
        working-directory: client_agent
        run: |
          uv sync

      - name: Run Client Unit Tests
        working-directory: client_agent
        run: |
          uv run pytest tests -m "not windows_only and not integration and not load" -q

  windows-validation:
    name: Windows Environment & Security Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install client dependencies on Windows
        working-directory: client_agent
        run: |
          uv sync

      - name: Run Client Tests on Windows
        working-directory: client_agent
        run: |
          uv run pytest tests -m "not integration and not load" -q
