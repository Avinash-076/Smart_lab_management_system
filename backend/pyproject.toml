[project]
name = "backend"
version = "1.0.0"
description = "SLMS Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "bcrypt<4.1",
    "fastapi[standard]>=0.140.7",
    "keyring>=25.7.0",
    "passlib[bcrypt]>=1.7.4",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "websocket-client>=1.8.0",
    "websockets>=16.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring multiple components or live server",
    "windows_only: Tests requiring Windows operating system and/or specific Windows privileges",
    "load: Performance and concurrency load tests",
]
